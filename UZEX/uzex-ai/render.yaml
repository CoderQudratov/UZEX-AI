services:
  - type: web
    name: uzex-ai
    runtime: docker
    rootDir: UZEX/uzex-ai
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_PATH
        value: data/processed/uzex.duckdb
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: MAX_CONCURRENT_QUERIES
        value: "2"
      - key: GEMINI_TIMEOUT_SECONDS
        value: "20"

