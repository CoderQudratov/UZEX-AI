[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "uzex-ai"
version = "0.1.0"
description = "Evidence-grounded UZEX agent: project foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.2,<2",
  "tzdata>=2026.1,<2027",
  "google-genai>=1.40,<2",
  "uvicorn>=0.35,<1",
  "httpx>=0.28,<1",
  "rapidfuzz>=3.14,<4",
  "groq>=0.37,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]
"scripts/**" = ["S101", "E501"]
